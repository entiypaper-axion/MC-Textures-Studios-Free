name: Publish release

# Pushing a tag v* publishes a GitHub Release from the files in the
# release-files branch, folder <tag>/ (NOTES.md is the release text).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-files
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test -d "$TAG"
          title="MCTS Free ${TAG#v}"
          [ -f "$TAG/TITLE.txt" ] && title="$(cat "$TAG/TITLE.txt")"
          files=$(ls "$TAG"/* | grep -v -E '/(NOTES\.md|TITLE\.txt)$')
          gh release create "$TAG" $files --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file "$TAG/NOTES.md"
